<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar </title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            display: flex;
            justify-content: space-around;
            background-color: rgb(18, 14, 54);
            color: white;
            padding: 10px;
            align-items: center;
            font-family: sans-serif;

        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .list {
            display: flex;
            gap: 10px;
            list-style: none;
        }

        button {
            padding: 5px 10px;
            font-size: 20px;
            display: none;
        }

        #sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 250px;
            height: 100%;
            background-color: lightblue;
            transition: .5s;
        }

        #sidebar.active {
            right: 0;

        }

        .sidebar-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: rgb(18, 14, 54);
            color: white;
            padding: 10px;
        }

        .mobileList {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            list-style: none;
            gap: 10px;
        }

        /* .bar {
            display: none;
        } */
        /* .active {
            display: none;
        } */

        @media screen and (max-width: 568px) {
            .list {
                display: none;
            }

            button {
                display: block;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">logo</div>
        <ul class="list">
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Services</li>
        </ul>
        <button id="menuBtn">≣</button>


    </nav>
    <div class="overlay" id="overlay"></div>
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="logo">logo</div>
            <button id="closeBtn">✕</button>

        </div>
        <ul class="mobileList">
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Services</li>
        </ul>
    </aside>
    <script>
        const menuBtn = document.getElementById('menuBtn')
        const closeBtn = document.getElementById('closeBtn')
        const sidebar = document.getElementById('sidebar')

        menuBtn.onclick = () => {
            sidebar.classList.add('active')
        }
        closeBtn.onclick = () => {
            sidebar.classList.remove('active')
        }



    </script>
</body>

</html>
