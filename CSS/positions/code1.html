<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .mainBox {
            width: 400px;
            background-color: rgb(182, 236, 255);
            height: 500px;
            position: relative;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            margin-top: 10px;
            text-align: center;
            border-radius: 10px;


        }

        .box-1 {
            background-color: lightcoral;
        }

        .box-2 {
            background-color: rgb(240, 229, 128);
        }

        .box-3 {
            background-color: rgb(137, 128, 240);
        }

        .box-4 {
            background-color: rgb(128, 240, 163);
            position: absolute;
            /* position: relative; */
            right: 0;
            top: 0;
        }

        .box-5 {
            background-color: rgb(70, 69, 83);

        }
    </style>
</head>

<body>
    <div class="mainBox">
        <div class="box box-1 ">Box1</div>
        <div class="box box-2 ">Box2</div>
        <div class="box box-3 ">Box3</div>
        <div class="box box-4 ">Box4</div>
        <div class="box box-5 ">Box5</div>
    </div>
</body>

</html>
