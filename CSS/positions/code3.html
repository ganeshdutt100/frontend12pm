<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 300px;
            height: 300px;

            position: relative;

        }

        .img1 {
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            margin-top: 100px;

        }

        .img2 {
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;


        }
    </style>
</head>

<body>
    <div>
        <img class="img1" src="../../images/img3.jpg" alt="">
        <img class="img2" src="https://webstockreview.net/images/hexagon-clipart-gold-hexagon.png" alt="">
    </div>
</body>

</html>
