<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
            text-decoration: underline;
            text-decoration: line-through;
            text-decoration: overline;
            text-decoration: none;

            text-align: center;
            text-align: start;
            text-align: end;
            text-transform: capitalize;
            text-transform: lowercase;
            text-transform: uppercase;

            text-shadow: -2px -3px 3px blue;




        }

        p {
            text-indent: 100px;
            line-height: 1.5;
            letter-spacing: 20px;
        }

        .box {
            width: 200px;
            height: 200px;
            box-shadow: 1px 1px 10px 1px rgba(128, 197, 239, 0.5);
            box-shadow: inset 1px 1px 10px 1px rgba(128, 197, 239, 0.5);
        }
    </style>
</head>

<body>
    <div class="box"></div>

    <h1>Lorem ipsum dolor sit amet.</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Atque repellat earum ea magni possimus repellendus
        asperiores temporibus eum vero assumenda placeat, aliquam id ipsa maxime laboriosam rem. Temporibus, adipisci
        repellendus!</p>
</body>

</html>
