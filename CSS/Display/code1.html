<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .Roopam {
            display: none;
        }

        p {
            height: 100px;
            width: 200px;
        }

        span {
            display: inline-block;
            height: 100px;
            width: 200px;
        }

        /* p {
            display: inline;
        }

        span {
            display: block;
        } */
    </style>
</head>

<body>
    <p class="Roopam" style="background-color: blueviolet;">Lorem ipsum dolor,</p>

    <p style="background-color: rgb(43, 226, 168);">Lorem ipsum dolor,</p>

    <span style="background-color: rgb(43, 58, 226);">Lorem ipsum dolor,</span>
    <span style="background-color: rgb(43, 58, 226);">Lorem ipsum dolor,</span>
</body>

</html>
