<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* laptop  */

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: black;
            padding: 20px 10px;
            color: white;
        }

        ul {
            display: flex;
            list-style: none;
            margin-top: -20px;
            gap: 20px;
        }




        a {
            color: white;
            text-decoration: none;
        }

        .text {
            background-color: rgba(29, 12, 62, 0.226);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        .section {
            height: 100%;
            width: 100%;
            background: url('https://images.unsplash.com/photo-1770723963970-ace02c7db50e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDQ4fENEd3V3WEpBYkV3fHxlbnwwfHx8fHw%3D');
            background-size: cover;
            background-repeat: no-repeat;
        }

        .bar {
            display: none;
        }

        /* phone Screen */
        @media only screen and (max-width:500px) {
            ul {
                display: none;
            }

            .bar {
                display: block;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">LOGO</div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="projects.html">Projects</a></li>
        </ul>
        <div class="bar">
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>

    <div class="section">
        <div class="text">
            <h1>I'm home page </h1>
        </div>
    </div>
</body>

</html>
