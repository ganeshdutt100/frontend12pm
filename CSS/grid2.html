<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            grid-template-columns: 200px 1fr 150px;
            grid-template-rows: 60px 1fr 50px;
            /* grid-template-rows: repeat(2, 1fr); */

            /* color: white; */

            grid-template-areas:
                "header header header "
                "sidebar main stats"
                "sidebar footer";

            color: white;
        }



        .navbar {
            background: rgb(9, 9, 30);
            grid-area: header;
            /* justify-content: center; */
            color: white;
        }

        .aside {
            background: rgb(19, 61, 45);
            /* grid-area: sidebar; */
        }

        .main {
            background: rgb(46, 67, 20);
            /* grid-area: main; */
        }

        .stats {
            background: rgb(24, 79, 82);
            /* grid-area: stats; */
        }

        .footer {
            background: rgb(37, 12, 18);
            /* grid-area: footer; */
        }
    </style>
</head>

<body>
    <div class="container">
        <nav class="navbar">Navbar </nav>
        <aside class="aside">Aside </aside>
        <main class="main">Main </main>
        <div class="stats">Stats Cards</div>
        <footer class="footer">Footer</footer>
    </div>
</body>

</html>
