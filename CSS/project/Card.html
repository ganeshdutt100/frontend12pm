<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        .Card {
            width: 300px;
            height: 400px;
            border: 1px solid black;
            text-align: center;
            border-bottom-right-radius: 20px;
            border-bottom-left-radius: 20px;

        }

        .image {
            background-color: lightblue;
            border-bottom-left-radius: 20px;
        }

        img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
        }

        .text {}

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background-color: rgb(135, 203, 233);
        }
    </style>
</head>

<body>
    <div class="Card">
        <!-- image -->
        <div class="image">
            <img src="../../images/img2.png" alt="">
        </div>
        <!-- text -->
        <div class="text">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquam deleniti culpa voluptates consequatur
                aliquid ab maxime, provident beatae pariatur laborum odit asperiores maiores vel repellendus, facere
                quam, ipsam quasi vitae!</p>
            <button>Click me </button>
        </div>
    </div>
</body>

</html>
