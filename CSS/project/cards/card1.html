<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 250px;
            height: 300px;
            background-image: url('/images/img1.png');
            background-size: cover;
            box-shadow: 1px 1px 1px 1px gray;
            padding: 20px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;

        }

        p {
            border-radius: 10px;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.199);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 20px;
            color: white;
            position: absolute;
            /* left: 100%; */
            transition: .5s linear;
            scale: 0;
            rotate: 0;



        }

        .box:hover p {
            /* left: 0; */
            rotate: 360deg;
            scale: 1;
        }
    </style>
</head>

<body>
    <div class="box">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic eos repellat nemo iure deserunt quibusdam
            similique reiciendis! Tenetur debitis, porro necessitatibus ea magnam non vitae culpa maxime excepturi ad.
            Nemo!</p>
    </div>
</body>

</html>
