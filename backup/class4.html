<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

<body>
    <table border="1">
        <tr>
            <th>heading1</th>
            <th>heading2</th>
            <th>heading3</th>
        </tr>
        <tr>
            <td>data1.1</td>
            <td>data2.1</td>
            <td rowspan="2">data3.1</td>
        </tr>
        <tr>
            <td>data1.2</td>
            <td>data2.2</td>
            <!-- <td>data3.2</td> -->
        </tr>
        <tr>
            <td>data1.3</td>
            <td>data2.3</td>
            <td>data3.3</td>
        </tr>
        <tr>
            <td>data1.4</td>
            <td colspan="2">data2.4</td>
            <!-- <td>data3.4</td> -->
        </tr>
    </table>
</body>

</html>
