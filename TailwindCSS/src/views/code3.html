<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>



</head>

<script>
    tailwind.config = {
        darkMode: 'class',
    }
</script>

<body>
    <nav class="flex justify-around bg-gray-900 text-white p-4 items-center dark:bg-white dark:text-black ">
        <div class="logo">LOGO</div>
        <ul class="flex gap-5 dark:text-black">
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Services</li>
            <li>Projects</li>
        </ul>
        <button onclick="toggleDarkMode()"
            class="border dark:border-black px-3 py-2 rounded-2xl">Dark/LightMode</button>
    </nav>
    <div class=" flex justify-center items-center  h-[100vh] bg-gray-800 text-white dark:bg-white dark:text-black ">
        <p class="text-center  ">Lorem ipsum dolor sit amet
            consectetur adipisicing elit. Illum vel sunt
            consectetur laudantium, nam eum deleniti
            ea sequi ex amet nobis, magnam obcaecati nesciunt maxime. Facere molestiae distinctio asperiores eligendi!
        </p>
    </div>
    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark')
        }
    </script>
</body>

</html>
